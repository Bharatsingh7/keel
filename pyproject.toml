[project]
name = "orbitdock"
version = "1.0.0"
description = "Next-Generation Intelligent Docker Container Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
orbitdock = "orbitdock.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbitdock"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
